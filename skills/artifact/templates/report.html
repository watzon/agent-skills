<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title><!-- SLOT: TITLE -->Document title</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f4f1ea;
      --ink: #1c1914;
      --mute: #5c564c;
      --rule: rgba(28, 25, 20, 0.14);
      --card: #fffdf8;
      --accent: #8a3b12;
      --voice: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
      --sans: "Avenir Next", "Segoe UI", sans-serif;
      --mono: "IBM Plex Mono", "SF Mono", ui-monospace, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --paper: #161410;
        --ink: #f3efe6;
        --mute: #b7b09f;
        --rule: rgba(243, 239, 230, 0.14);
        --card: #201c16;
        --accent: #e08a55;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --paper: #161410;
      --ink: #f3efe6;
      --mute: #b7b09f;
      --rule: rgba(243, 239, 230, 0.14);
      --card: #201c16;
      --accent: #e08a55;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; background: var(--paper); color: var(--ink); }
    body { font: 20px/1.55 var(--voice); }
    .doc { max-width: 38rem; margin: 0 auto; padding: 4.5rem 1.4rem 6rem; }
    .eyebrow { font: 0.72rem/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); margin: 0 0 0.8rem; }
    h1 { font-size: 2.2rem; line-height: 1.15; font-weight: 600; margin: 0 0 0.7rem; }
    .subtitle { font-size: 1.05rem; color: var(--mute); margin: 0 0 2rem; }
    h2 { font-size: 1.35rem; margin: 2.4rem 0 0.7rem; }
    h3 { font-size: 1.05rem; margin: 1.6rem 0 0.5rem; }
    p { margin: 0 0 1rem; }
    a { color: var(--accent); }
    .takeaways { background: var(--card); border: 1px solid var(--rule); padding: 1rem 1.2rem; margin: 0 0 2rem; }
    .takeaways-label { font: 0.72rem/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); margin: 0 0 0.5rem; }
    .takeaways ul { margin: 0; padding-left: 1.1rem; }
    .takeaways li { margin: 0.3rem 0; }
    .toc { margin: 0 0 2.4rem; padding-top: 0.4rem; border-top: 1px solid var(--rule); }
    .toc-label { font: 0.72rem/1.3 var(--sans); letter-spacing: 0.08em; text-transform: uppercase; color: var(--mute); margin: 1rem 0 0.5rem; }
    .toc ol { margin: 0; padding-left: 1.2rem; }
    .toc a { color: inherit; text-decoration: none; border-bottom: 1px solid var(--rule); }
    table { width: 100%; border-collapse: collapse; font-size: 0.92rem; margin: 1rem 0 1.4rem; }
    th, td { text-align: left; padding: 0.45rem 0.4rem; border-bottom: 1px solid var(--rule); vertical-align: top; }
    pre, code { font-family: var(--mono); font-size: 0.84rem; }
    pre { background: var(--card); border: 1px solid var(--rule); padding: 0.9rem 1rem; overflow: auto; }
    blockquote { margin: 1rem 0; padding: 0.2rem 0 0.2rem 1rem; border-left: 3px solid var(--accent); color: var(--mute); }
    figure { margin: 1.4rem 0; }
    figcaption { font: 0.82rem/1.4 var(--sans); color: var(--mute); margin-top: 0.5rem; }
    .appendix { margin-top: 3rem; padding-top: 1rem; border-top: 1px solid var(--rule); }
    @media print {
      :root {
        --paper: #ffffff;
        --ink: #1c1914;
        --mute: #5c564c;
        --rule: rgba(28, 25, 20, 0.14);
        --card: #fffdf8;
        --accent: #8a3b12;
      }
      body { font-size: 12pt; }
      .doc { max-width: none; padding: 0; }
      table, pre, figure, blockquote, .takeaways { break-inside: avoid; }
    }
  </style>
</head>
<body>
<article class="doc">
  <header class="masthead">
    <p class="eyebrow"><!-- SLOT: EYEBROW - doc type and date -->Report</p>
    <h1><!-- SLOT: TITLE -->Document title</h1>
    <p class="subtitle"><!-- SLOT: SUBTITLE -->One sentence stating the finding or the scope.</p>
  </header>

  <!-- SLOT: KEY_TAKEAWAYS - 3-5 one-line bullets, or delete this aside -->
  <aside class="takeaways" aria-labelledby="takeaways-label">
    <p class="takeaways-label" id="takeaways-label">Key takeaways</p>
    <ul>
      <li>First takeaway with a number or a specific.</li>
    </ul>
  </aside>

  <nav class="toc">
    <div class="toc-label">Contents</div>
    <ol>
      <!-- SLOT: TOC_ITEMS - one li per SECTIONS h2, filled after the sections exist -->
      <li><a href="#s1">Section one</a></li>
    </ol>
  </nav>

  <!-- SLOT: SECTIONS - one section per topic, lead with the conclusion -->
  <section id="s1">
    <h2>Section heading</h2>
    <p>Body paragraph.</p>
  </section>

  <!-- SLOT: APPENDIX - delete this section if unused -->
  <section class="appendix">
    <h2>Appendix</h2>
    <p>Supporting detail that would interrupt the main flow.</p>
  </section>
</article>
<script>
  (() => {
    const list = document.querySelector("nav.toc ol");
    const heads = document.querySelectorAll("article.doc > section:not(.appendix) > h2");
    const sections = document.querySelectorAll("article.doc > section:not(.appendix)");
    if (!list) return;
    if (heads.length === 0 || heads.length < sections.length) {
      list.dataset.toc = heads.length === 0 ? "static-no-heads" : "static-partial-match";
      return;
    }
    list.dataset.toc = "rebuilt";
    list.replaceChildren();
    heads.forEach((h, i) => {
      const sec = h.parentElement;
      if (!sec.id) sec.id = "s" + (i + 1);
      const a = document.createElement("a");
      a.href = "#" + sec.id;
      a.textContent = h.textContent;
      const li = document.createElement("li");
      li.appendChild(a);
      list.appendChild(li);
    });
  })();
</script>
</body>
</html>
